name: CI

on:
  push:
    branches: [master, modernize/2026]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - name: Checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup PHP 2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --no-scripts --no-plugins --prefer-dist
      - run: composer audit --no-plugins
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/phpunit
      - run: python3 scripts/verify_schema.py db/schema.sql
